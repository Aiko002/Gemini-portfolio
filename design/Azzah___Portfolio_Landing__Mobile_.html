<body class="bg-lawn-green text-light-on-primary antialiased selection:bg-light-on-primary selection:text-light-primary">
  <div class="relative min-h-screen w-full max-w-[390px] mx-auto bg-lawn-green overflow-x-hidden">
    <!-- Simplified Top Bar: Logo + Menu Icon -->
    <header class="fixed top-0 inset-x-0 z-30 max-w-[390px] mx-auto">
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-light-on-primary-container/90 via-light-on-primary-container/55 to-transparent"></div>
      <div class="relative flex items-center justify-between px-gutter-lg py-gutter-md">
        <a href="#home" aria-label="Azzah home" data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg-mobile" class="font-display text-display-lg-mobile text-light-on-primary leading-none">A.</a>

        <button id="mobile-menu-btn" type="button" aria-label="Open navigation menu" aria-expanded="false" class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-light-on-primary/40 bg-light-primary/90 text-light-on-primary transition-colors duration-state-change ease-state-change hover:bg-light-primary">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">menu</span>
        </button>
      </div>

      <!-- Collapsible Mobile Menu Drawer -->
      <nav id="mobile-nav-drawer" aria-label="Mobile navigation" class="hidden mx-gutter-lg rounded-md border border-light-on-primary/60 bg-light-surface-container-lowest/95 backdrop-blur-md p-gutter-md shadow-lg">
        <div class="flex flex-col gap-gutter-sm">
          <a href="#home" data-design-text-token="label-lg" class="font-label text-label-lg text-light-primary py-gutter-xs">Home</a>
          <a href="../projects/AzzahProjects.html" data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface py-gutter-xs">Gallery</a>
          <a href="../papers/AzzahPapers.html" data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface py-gutter-xs">Papers &amp; Timeline</a>
        </div>
      </nav>
    </header>

    <!-- Vertically Scrollable Park Lawn -->
    <main class="relative w-full h-[1040px] overflow-hidden bg-lawn-green" aria-label="Scrollable park lawn with interactive hotspots">
      <img src="https://lh3.googleusercontent.com/aida/ALJJyrBZkYj56P_HDYbIh5zVvvQ_L24LPwd6NZuhBslIsur4u-Vl-FGvuA-pI7MncEAhsfnBVHVYcLPKiDUzFdvPbc8DKVR5T3bdVXhaSPNHL1wim55BxPJGJmIVdTrN3SI2xvpOEcl9K8BajR5yHtAqvaYfI18fkQGwBc5vNTcQniXHcnD0dMF1BrB8ZmYsapJAMINXfgIaYnVD6hvAKXiL8lRSkRrQTlN1Nzj47T63LEgyJqrPgxvgn6VaGbrh" alt="Vertical top-down flat vector illustration of a sunny park lawn with people sunbathing, reading, playing guitar, wearing a sunhat, tossing a beach ball, picnicking, and sitting with a cat" class="w-full h-full object-cover object-center select-none pointer-events-none" data-stitch-original-src="1a14121f9f30d4ff===../../images/park_lawn_mobile.jpg">

      <!-- Hotspot 1: Sunbather (Projects) -->
      <button type="button" data-hotspot="projects" aria-label="Projects — sunbathing person" class="hotspot-btn absolute left-[22%] top-[20%] w-9 h-9 rounded-full border-2 border-light-on-primary bg-light-primary/85 text-light-on-primary shadow-md flex items-center justify-center transition-transform duration-state-change ease-state-change hover:scale-110">
        <span class="material-symbols-outlined text-body-md" aria-hidden="true">wb_sunny</span>
      </button>

      <!-- Hotspot 2: Reader (Papers & Publications) -->
      <button type="button" data-hotspot="papers" aria-label="Papers and Publications — reading person" class="hotspot-btn absolute left-[62%] top-[17%] w-9 h-9 rounded-full border-2 border-light-on-primary bg-light-primary/85 text-light-on-primary shadow-md flex items-center justify-center transition-transform duration-state-change ease-state-change hover:scale-110">
        <span class="material-symbols-outlined text-body-md" aria-hidden="true">menu_book</span>
      </button>

      <!-- Hotspot 3: Sunhat (Socials) -->
      <button type="button" data-hotspot="socials" aria-label="Socials — person in sunhat" class="hotspot-btn absolute left-[64%] top-[42%] w-9 h-9 rounded-full border-2 border-light-on-primary bg-light-primary/85 text-light-on-primary shadow-md flex items-center justify-center transition-transform duration-state-change ease-state-change hover:scale-110">
        <span class="material-symbols-outlined text-body-md" aria-hidden="true">alternate_email</span>
      </button>

      <!-- Hotspot 4: Guitarist (About Me — active) -->
      <button type="button" data-hotspot="about" aria-label="About Me — person with guitar" class="hotspot-btn absolute left-[42%] top-[51%] w-10 h-10 rounded-full border-2 border-light-on-primary bg-mustard-accent text-light-on-surface shadow-lg scale-110 flex items-center justify-center transition-transform duration-state-change ease-state-change">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">music_note</span>
      </button>

      <!-- Hotspot 5: Person with Cat (Marginalia / Notes) -->
      <button type="button" data-hotspot="notes" aria-label="Field Notes — person with cat" class="hotspot-btn absolute left-[76%] top-[71%] w-9 h-9 rounded-full border-2 border-light-on-primary bg-light-primary/85 text-light-on-primary shadow-md flex items-center justify-center transition-transform duration-state-change ease-state-change hover:scale-110">
        <span class="material-symbols-outlined text-body-md" aria-hidden="true">pets</span>
      </button>
    </main>

    <!-- Bottom Sheet (opens on character hotspot tap) -->
    <aside id="lawn-bottom-sheet" role="dialog" aria-label="Character details" class="fixed bottom-0 inset-x-0 z-30 max-w-[390px] mx-auto rounded-t-xl border-t border-light-on-primary/80 bg-light-surface-container-lowest/90 backdrop-blur-md px-gutter-lg pt-gutter-sm pb-gutter-lg sheet-shadow">
      <div class="w-10 h-1 rounded-full bg-light-outline-variant mx-auto mb-gutter-md"></div>

      <div class="flex items-start justify-between gap-gutter-md mb-gutter-xs">
        <h2 id="sheet-title" data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">About Me</h2>
        <button id="sheet-close-btn" type="button" aria-label="Close sheet" class="inline-flex items-center justify-center w-7 h-7 rounded-full text-light-on-surface-variant hover:bg-light-surface-container">
          <span class="material-symbols-outlined text-body-md" aria-hidden="true">close</span>
        </button>
      </div>

      <p id="sheet-desc" data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant mb-gutter-md">Full-stack developer crafting calm, playful web tools in the sun.</p>

      <a id="sheet-link" href="../projects/AzzahProjects.html" class="inline-flex items-center gap-gutter-xs font-label text-label-sm text-light-primary transition-opacity duration-state-change ease-state-change hover:opacity-75">
        <span id="sheet-link-label" data-design-text-token="label-sm">Read more</span>
        <span class="material-symbols-outlined text-body-md" aria-hidden="true">arrow_forward</span>
      </a>
    </aside>
  </div>

  <script>
    (function () {
      const sheetData = {
        about: {
          title: 'About Me',
          desc: 'Full-stack developer crafting calm, playful web tools in the sun.',
          linkLabel: 'Read more',
          href: '../projects/AzzahProjects.html'
        },
        socials: {
          title: 'Socials',
          desc: 'Find me on GitHub, LinkedIn, X, Instagram, or drop an email.',
          linkLabel: 'Say hello',
          href: '#socials'
        },
        projects: {
          title: 'Projects',
          desc: 'Sunspot Park Map, Lawn Synth Studio, and four more web experiments.',
          linkLabel: 'See all projects',
          href: '../projects/AzzahProjects.html'
        },
        papers: {
          title: 'Papers & Publications',
          desc: 'Research on spatial canvases, reactive layout, and paper-grain shaders.',
          linkLabel: 'View all',
          href: '../papers/AzzahPapers.html'
        },
        notes: {
          title: 'Field Notes',
          desc: 'Short essays on software craft, sunny walks, and building slowly.',
          linkLabel: 'Browse notes',
          href: '#notes'
        }
      };

      const sheet = document.getElementById('lawn-bottom-sheet');
      const sheetTitle = document.getElementById('sheet-title');
      const sheetDesc = document.getElementById('sheet-desc');
      const sheetLink = document.getElementById('sheet-link');
      const sheetLinkLabel = document.getElementById('sheet-link-label');
      const closeBtn = document.getElementById('sheet-close-btn');
      const hotspots = document.querySelectorAll('.hotspot-btn');

      hotspots.forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = sheetData[btn.dataset.hotspot];
          if (!item) return;
          sheetTitle.textContent = item.title;
          sheetDesc.textContent = item.desc;
          sheetLinkLabel.textContent = item.linkLabel;
          sheetLink.setAttribute('href', item.href);
          sheet.classList.remove('hidden');

          hotspots.forEach((b) => {
            b.classList.remove('bg-mustard-accent', 'text-light-on-surface', 'scale-110');
            b.classList.add('bg-light-primary/85', 'text-light-on-primary');
          });
          btn.classList.remove('bg-light-primary/85', 'text-light-on-primary');
          btn.classList.add('bg-mustard-accent', 'text-light-on-surface', 'scale-110');
        });
      });

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          sheet.classList.add('hidden');
        });
      }

      const menuBtn = document.getElementById('mobile-menu-btn');
      const drawer = document.getElementById('mobile-nav-drawer');
      if (menuBtn && drawer) {
        menuBtn.addEventListener('click', () => {
          const isOpen = !drawer.classList.contains('hidden');
          drawer.classList.toggle('hidden', isOpen);
          menuBtn.setAttribute('aria-expanded', String(!isOpen));
        });
      }
    })();
  </script>
