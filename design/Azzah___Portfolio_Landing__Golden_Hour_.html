  <script>
    (function () {

      navLinks.forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          navLinks.forEach((item) => {
            item.classList.remove('border-light-on-primary');
            item.classList.add('border-transparent');
          });
          link.classList.remove('border-transparent');
          link.classList.add('border-light-on-primary');
        });
      });

      const searchForm = document.getElementById('lawn-search-form');
      if (searchForm) {
        searchForm.addEventListener('submit', (e) => {
          e.preventDefault();
        });
      }
    })();
